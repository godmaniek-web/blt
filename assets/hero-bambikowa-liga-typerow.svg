<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" role="img" aria-labelledby="title desc">
  <title id="title">Bambikowa Liga Typerow</title>
  <desc id="desc">Stadionowa grafika hero z pilka, murawa i tablica wynikow.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07101d"/><stop offset=".52" stop-color="#132b42"/><stop offset="1" stop-color="#1c7c54"/></linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f9d63"/><stop offset="1" stop-color="#145a3d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1680" height="720" fill="url(#sky)"/>
  <circle cx="210" cy="130" r="180" fill="#c9962d" opacity=".12"/>
  <circle cx="1400" cy="130" r="240" fill="#fff" opacity=".08"/>
  <path d="M0 488 C320 420 520 468 800 422 C1110 372 1330 420 1680 358 L1680 720 L0 720 Z" fill="url(#pitch)"/>
  <path d="M150 645 C430 565 1130 565 1480 645" fill="none" stroke="#fffdf8" stroke-width="10" opacity=".45"/>
  <g filter="url(#shadow)">
    <rect x="535" y="106" width="610" height="220" rx="28" fill="#fffdf8"/>
    <rect x="560" y="132" width="560" height="72" rx="16" fill="#07101d"/>
    <text x="840" y="180" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#f5f2ea">BAMBIKOWA LIGA TYPEROW</text>
    <text x="700" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#182033">7</text>
    <text x="700" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b7280">GRACZY</text>
    <text x="840" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#182033">104</text>
    <text x="840" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b7280">MECZE</text>
    <text x="980" y="270" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#182033">-15</text>
    <text x="980" y="298" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#6b7280">MINUT</text>
  </g>
  <g transform="translate(1230 410)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="82" fill="#fffdf8"/>
    <path d="M0 -62 L53 -20 L33 60 L-33 60 L-53 -20 Z" fill="#182033"/>
    <path d="M0 -28 L27 -8 L17 31 L-17 31 L-27 -8 Z" fill="#f5f2ea"/>
  </g>
</svg>
